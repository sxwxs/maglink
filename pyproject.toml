[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "maglink"
version = "0.3.0"
description = "Email magic-link auth with device-flow confirmation. Framework-agnostic core, optional Flask adapter."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sxwxs", email = "sxwxs@msn.com" }]
keywords = ["auth", "email", "magic-link", "device-flow", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sxwxs/maglink"
Repository = "https://github.com/sxwxs/maglink.git"
Issues = "https://github.com/sxwxs/maglink/issues"

[project.optional-dependencies]
flask = ["Flask>=2.0"]
dev = ["Flask>=2.0", "pytest>=7"]

[tool.setuptools.packages.find]
include = ["maglink*"]
